name: Keep Supabase Active
on:
  schedule:
    - cron: '0 0 */4 * *' # Runs automatically every 4 days
  workflow_dispatch: # Allows you to test it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
         curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/students?select=id&limit=1" \
  -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
  -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
